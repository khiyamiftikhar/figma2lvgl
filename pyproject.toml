[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figma2lvgl"
dynamic = ["version"]
description = "Generate LVGL9 C source files from Figma XML exports"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Khiyam Iftikhar", email = "khiyamiftikhar@gmail.com" }
]
dependencies = [
    "platformdirs>=3.0",
]
keywords = ["lvgl", "lvgl9", "figma", "codegen", "embedded", "ui", "lvgl-ui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Embedded Systems",
    "Environment :: Console",
    "Intended Audience :: Developers",
]

[project.scripts]
figma2lvgl = "figma2lvgl.main:main"

[project.urls]
Homepage = "https://github.com/khiyamiftikhar/figma2lvgl"
Issues   = "https://github.com/khiyamiftikhar/figma2lvgl/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["figma2lvgl*"]

[tool.setuptools.package-data]
"figma2lvgl" = ["static_src/*.h", "static_src/*.c"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme   = "no-local-version"
write_to       = "figma2lvgl/_version.py"